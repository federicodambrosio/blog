name: Refresh FreshRSS

on:
  schedule:
    # Runs every 5 minutes. GitHub Actions cron can lag under load,
    # so treat this as "roughly every 5 min", not exact.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FreshRSS actualize
        env:
          FRESHRSS_ACTUALIZE_URL: ${{ secrets.FRESHRSS_ACTUALIZE_URL }}
        run: |
          curl -s --max-time 150 --connect-timeout 30 \
            -w "\nHTTP status: %{http_code}\n" \
            "$FRESHRSS_ACTUALIZE_URL" -o /tmp/response.txt
          echo "--- Response body ---"
          cat /tmp/response.txt
