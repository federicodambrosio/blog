name: Refresh FreshRSS

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron can lag under load,
    # so treat this as "roughly every 15 min", not exact.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FreshRSS actualize
        env:
          FRESHRSS_ACTUALIZE_URL: ${{ secrets.FRESHRSS_ACTUALIZE_URL }}
        run: |
          curl -sf "$FRESHRSS_ACTUALIZE_URL" -o /dev/null
